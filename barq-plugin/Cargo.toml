[package]
name = "barq-plugin"
version = "0.0.1"
edition = "2021"


[dependencies]
# General dependencies
serde = { workspace = true }
serde_json = { workspace = true }
log = { workspace = true }
anyhow = { workspace = true }
hex = "0.4"

# Core lightning-rpc dependencies
# cln4rust master 15cdbec: async RPC client (feature `async`), the plugin EOF
# fix, the incremental gossip_store reader, hook filters (`register_hook_with_filters`,
# laanwj/cln4rust#148) and deferred responses (`RPCCommand::call_deferred`,
# laanwj/cln4rust#150).
clightningrpc = { git = "https://github.com/laanwj/cln4rust.git", rev = "15cdbec56c7e54f555cfa7cd293b04fb1d72b2c6", features = ["async"] }
clightningrpc-common = { git = "https://github.com/laanwj/cln4rust.git", rev = "15cdbec56c7e54f555cfa7cd293b04fb1d72b2c6", features = ["async"] }
clightningrpc-plugin = { git = "https://github.com/laanwj/cln4rust.git", rev = "15cdbec56c7e54f555cfa7cd293b04fb1d72b2c6" }
clightningrpc-plugin-macros = { git = "https://github.com/laanwj/cln4rust.git", rev = "15cdbec56c7e54f555cfa7cd293b04fb1d72b2c6" }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }

# Barq dependencies
barq-common = { path = "../barq-common" }
