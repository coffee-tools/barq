[package]
name = "barq-plugin"
version = "0.0.1"
edition = "2021"


[dependencies]
# General dependencies
serde = { workspace = true }
serde_json = { workspace = true }
log = { workspace = true }
anyhow = { workspace = true }
hex = "0.4"

# Core lightning-rpc dependencies
# cln4rust master: async RPC client (feature `async`) and the plugin EOF fix.
clightningrpc = { git = "https://github.com/laanwj/cln4rust.git", rev = "586f4f454ddc196bb09b7b4a6f56a618a73f6a87", features = ["async"] }
clightningrpc-common = { git = "https://github.com/laanwj/cln4rust.git", rev = "586f4f454ddc196bb09b7b4a6f56a618a73f6a87", features = ["async"] }
clightningrpc-plugin = { git = "https://github.com/laanwj/cln4rust.git", rev = "586f4f454ddc196bb09b7b4a6f56a618a73f6a87" }
clightningrpc-plugin-macros = { git = "https://github.com/laanwj/cln4rust.git", rev = "586f4f454ddc196bb09b7b4a6f56a618a73f6a87" }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }

# Barq dependencies
barq-common = { path = "../barq-common" }
