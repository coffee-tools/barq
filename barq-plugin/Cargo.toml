[package]
name = "barq-plugin"
version = "0.0.1"
edition = "2021"


[dependencies]
# General dependencies
serde = { workspace = true }
serde_json = { workspace = true }
log = { workspace = true }
anyhow = { workspace = true }
hex = "0.4"

# Core lightning-rpc dependencies
# cln4rust master 7835042 plus hook filters (laanwj/cln4rust#148): async RPC
# client (feature `async`), the plugin EOF fix, the incremental gossip_store
# reader and `register_hook_with_filters`. Move to master once #148 merges.
clightningrpc = { git = "https://github.com/laanwj/cln4rust.git", rev = "31e5f4e708d65b532c941511a1323adea592eef4", features = ["async"] }
clightningrpc-common = { git = "https://github.com/laanwj/cln4rust.git", rev = "31e5f4e708d65b532c941511a1323adea592eef4", features = ["async"] }
clightningrpc-plugin = { git = "https://github.com/laanwj/cln4rust.git", rev = "31e5f4e708d65b532c941511a1323adea592eef4" }
clightningrpc-plugin-macros = { git = "https://github.com/laanwj/cln4rust.git", rev = "31e5f4e708d65b532c941511a1323adea592eef4" }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }

# Barq dependencies
barq-common = { path = "../barq-common" }
