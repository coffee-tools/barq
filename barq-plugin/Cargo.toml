[package]
name = "barq-plugin"
version = "0.0.1"
edition = "2021"


[dependencies]
# General dependencies
serde = { workspace = true }
serde_json = { workspace = true }
log = { workspace = true }
anyhow = { workspace = true }
hex = "0.4"

# Core lightning-rpc dependencies
# cln4rust master: async RPC client (feature `async`) and the plugin EOF fix,
# plus the incremental gossip_store reader.
clightningrpc = { git = "https://github.com/laanwj/cln4rust.git", rev = "bf27af90a8d5e6551816aaa130472eff62354988", features = ["async"] }
clightningrpc-common = { git = "https://github.com/laanwj/cln4rust.git", rev = "bf27af90a8d5e6551816aaa130472eff62354988", features = ["async"] }
clightningrpc-plugin = { git = "https://github.com/laanwj/cln4rust.git", rev = "bf27af90a8d5e6551816aaa130472eff62354988" }
clightningrpc-plugin-macros = { git = "https://github.com/laanwj/cln4rust.git", rev = "bf27af90a8d5e6551816aaa130472eff62354988" }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }

# Barq dependencies
barq-common = { path = "../barq-common" }
